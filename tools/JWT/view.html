<h2>JWT Decoder</h2>

<p class="subtitle">
    Decode and inspect a JSON Web Token.
</p>

<div class="tool-panel">

    <textarea
        id="jwtInput"
        placeholder="Paste your JWT token here..."
    ></textarea>

    <div class="tool-actions">

        <button id="decodeJwtButton">
            Decode
        </button>

        <button id="clearJwtButton">
            Clear
        </button>

    </div>

    <h3>Header</h3>

    <textarea
        id="jwtHeader"
        placeholder="JWT header..."
        readonly
    ></textarea>

    <h3>Payload</h3>

    <textarea
        id="jwtPayload"
        placeholder="JWT payload..."
        readonly
    ></textarea>

</div>
