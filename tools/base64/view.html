<h2>Base64 Encoder / Decoder</h2>

<p class="subtitle">
    Encode or decode Base64 text.
</p>


<div class="tool-panel">
    <textarea
        id="base64Input"
        placeholder="Enter text or Base64..."
    ></textarea>

    <div class="tool-actions">
        <button id="encodeButton">
            Encode
        </button>

        <button id="decodeButton">
            Decode
        </button>

        <button id="clearButton">
            Clear
        </button>
    </div>

    <textarea
        id="base64Output"
        placeholder="Result..."
        readonly
    ></textarea>

</div>
