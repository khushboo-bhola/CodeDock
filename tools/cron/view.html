<h2>Cron Expression Builder</h2>

<p class="subtitle">
    Create and understand cron expressions easily.
</p>

<div class="tool-panel">
    <div class="form-group">
        <label for="cronMinute">Minute</label>
        <select id="cronMinute">
            <option value="*">Every minute</option>
            <option value="0">0</option>
            <option value="15">15</option>
            <option value="30">30</option>
            <option value="45">45</option>
        </select>
    </div>

    <div class="form-group">
        <label for="cronHour">Hour</label>
        <select id="cronHour">
            <option value="*">Every hour</option>
            <option value="0">12 AM</option>
            <option value="6">6 AM</option>
            <option value="9">9 AM</option>
            <option value="12">12 PM</option>
            <option value="18">6 PM</option>
        </select>
    </div>

    <div class="form-group">
        <label for="cronDay">Day of Month</label>
        <select id="cronDay">
            <option value="*">Every day</option>
            <option value="1">1</option>
            <option value="15">15</option>
            <option value="30">30</option>
        </select>
    </div>

    <div class="form-group">
        <label for="cronMonth">Month</label>
        <select id="cronMonth">
            <option value="*">Every month</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
    </div>

    <div class="form-group">
        <label for="cronWeekday">Day of Week</label>
        <select id="cronWeekday">
            <option value="*">Every day</option>
            <option value="0">Sunday</option>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
        </select>
    </div>

    <div class="tool-actions">
        <button id="generateCronButton">
            Generate
        </button>

        <button id="clearCronButton">
            Clear
        </button>
    </div>

    <textarea
        id="cronOutput"
        placeholder="Cron expression..."
        readonly
    ></textarea>

    <p id="cronDescription" class="subtitle"></p>
</div>
