<h2>Password Generator</h2>

<p class="subtitle">
    Generate a strong random password.
</p>

<div class="tool-panel">

    <label for="passwordLength">
        Password Length
    </label>

    <input
        type="number"
        id="passwordLength"
        value="16"
        min="4"
        max="128"
    >

    <div class="tool-actions">

        <button id="generatePasswordButton">
            Generate Password
        </button>

        <button id="clearPasswordButton">
            Clear
        </button>

    </div>

    <textarea
        id="passwordOutput"
        placeholder="Generated password..."
        readonly
    ></textarea>

</div>
