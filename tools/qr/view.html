<h2>QR Code Generator</h2>

<p class="subtitle">
    Generate a QR code from text or a URL.
</p>

<div class="tool-panel">

    <textarea
        id="qrInput"
        placeholder="Enter text or URL..."
    ></textarea>

    <div class="tool-actions">

        <button id="generateQrButton">
            Generate QR
        </button>

        <button id="clearQrButton">
            Clear
        </button>

    </div>

    <div id="qrOutput"></div>

</div>
