<h2>Timestamp Converter</h2>

<p class="subtitle">
    Convert Unix timestamps to readable dates and dates to Unix timestamps.
</p>

<div class="tool-panel">

    <label for="timestampInput">
        Unix Timestamp
    </label>

    <input
        type="text"
        id="timestampInput"
        placeholder="Example: 1725000000"
    >

    <div class="tool-actions">

        <button id="timestampToDateButton">
            Timestamp → Date
        </button>

        <button id="dateToTimestampButton">
            Date → Timestamp
        </button>

        <button id="currentTimestampButton">
            Current Timestamp
        </button>

        <button id="clearTimestampButton">
            Clear
        </button>

    </div>

    <label for="timestampOutput">
        Result
    </label>

    <textarea
        id="timestampOutput"
        placeholder="Result..."
        readonly
    ></textarea>

</div>
