<h2>URL Encoder / Decoder</h2>

<p class="subtitle">
    Encode or decode URL text.
</p>

<div class="tool-panel">

    <textarea
        id="urlInput"
        placeholder="Enter text or encoded URL..."
    ></textarea>

    <div class="tool-actions">

        <button id="encodeUrlButton">
            Encode
        </button>

        <button id="decodeUrlButton">
            Decode
        </button>

        <button id="clearUrlButton">
            Clear
        </button>

    </div>

    <textarea
        id="urlOutput"
        placeholder="Result..."
        readonly
    ></textarea>

</div>
