<h2>UUID Generator</h2>

<p class="subtitle">
    Generate unique UUIDs.
</p>

<div class="tool-panel">

    <textarea
        id="uuidOutput"
        placeholder="Generated UUIDs..."
        readonly
    ></textarea>

    <div class="tool-actions">

        <button id="generateUuidButton">
            Generate UUID
        </button>

        <button id="clearUuidButton">
            Clear
        </button>

    </div>

</div>
